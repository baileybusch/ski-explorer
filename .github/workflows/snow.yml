name: Refresh snow data
on:
  schedule: [{ cron: "17 12 * * *" }]   # daily ~5am PT
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_snow.py
      - run: |
          git config user.name "snow-bot"; git config user.email "actions@github.com"
          git add public/data/snow.json
          git diff --cached --quiet || (git commit -m "data: refresh snowfall $(date -u +%F)" && git push)
